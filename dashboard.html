<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StitchPro · Dashboard</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
<main id="page">
  <div class="grid kpis" id="kpis"></div>

  <section class="card">
    <div class="bar">
      <div class="ttl"><svg class="i big"><use href="#i-cut"/></svg><div><h3>Calculadora de Cotización Rápida</h3><p>Ingresa los detalles y obtén un precio estimado al instante</p></div></div>
      <div class="seg"><button data-tipo="arreglo_rapido" class="on">Arreglo</button><button data-tipo="confeccion">Prenda Nueva</button></div>
    </div>
    <div class="calc-g">
      <div class="form">
        <label>Tipo de Prenda<select id="dq-prenda"></select></label>
        <label>Buscar arreglo o prenda<input id="dq-buscar" list="dq-list" placeholder="Escribe para buscar…" autocomplete="off"><datalist id="dq-list"></datalist></label>
        <label>Tiempo de trabajo <span id="dq-hlbl" class="hl">30 min</span><input id="dq-min" type="range" min="1" max="600" step="1" value="30"></label>
        <label>Margen de ganancia %<input id="dq-margen" type="number" min="0" step="any" value="30"></label>
        <div class="full"><label>Materiales usados (editables solo para esta cotización)</label><div id="dq-mats"></div>
          <div class="addmat"><select id="dq-addmat"></select><button type="button" class="btn ghost sm" id="dq-addbtn">+ Agregar</button></div></div>
        <p class="hint full" id="dq-hint"></p>
      </div>
      <div class="price"><small>Precio Final</small><b id="dq-precio">—</b><span class="hint" id="dq-desg"></span>
        <select id="dq-cli"></select>
        <button class="btn green" id="dq-calc">Calcular</button><button class="btn ghost sm" id="dq-order">Crear orden</button></div>
    </div>
  </section>

  <section class="card" style="margin-top:16px">
    <div class="bar"><div><h3>Órdenes Recientes</h3><p>Últimas órdenes registradas en tu taller</p></div></div>
    <div class="tbl-w" id="recientes"></div>
  </section>
</main>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
