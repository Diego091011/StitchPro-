<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StitchPro · Ingresar</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<form class="card login" id="form" novalidate>
  <div class="logo" id="logo"></div>
  <div class="tabs"><button type="button" class="on" data-mode="in">Ingresar</button><button type="button" data-mode="up">Crear cuenta</button></div>
  <label>Correo<input name="email" type="email" required autocomplete="email" placeholder="tu@correo.com"></label>
  <label>Contraseña<input name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label>
  <div class="msg" id="msg"></div>
  <button class="btn green" id="go">Ingresar</button>
</form>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
