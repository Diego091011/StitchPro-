<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StitchPro · Reportes</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
<main id="page">
  <div class="bar"><div><h2 style="margin:0">Reportes</h2><p>Ventas, utilidad y consumo de materiales</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="seg" id="per"><button data-m="1">Este mes</button><button data-m="3">3 meses</button><button data-m="6" class="on">6 meses</button><button data-m="12">12 meses</button><button data-m="0">Todo</button></div>
    <button class="btn ghost" id="csv">Exportar CSV</button></div></div>
  <div class="grid kpis" id="kpis"></div>
  <section class="card"><div class="bar"><div><h3>Ventas y utilidad por mes</h3><p>Utilidad = total cobrado de la orden − costo neto de sus ítems</p></div><div class="hint" id="leg"></div></div>
    <canvas id="ch" style="width:100%;height:260px;display:block"></canvas></section>
  <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:16px">
    <section class="card"><h3 style="margin-bottom:10px">Servicios más vendidos</h3><div class="tbl-w" id="t-srv"></div></section>
    <section class="card"><h3 style="margin-bottom:10px">Mejores clientes</h3><div class="tbl-w" id="t-cli"></div></section>
  </div>
  <section class="card" style="margin-top:16px"><h3 style="margin-bottom:4px">Consumo de materiales</h3><p style="margin-bottom:10px">Según las recetas de las órdenes del periodo</p><div class="tbl-w" id="t-mat"></div></section>
</main>
<script type="module" src="js/pages/reportes.js"></script>
</body>
</html>
